appId: com.aetherrag.desktop
productName: AETHER RAG
copyright: Copyright © 2026 AETHER RAG

directories:
  output: ../dist_installer
  buildResources: build

# The main process only uses Node/Electron builtins, so we ship just the
# electron sources — NOT the frontend node_modules (those live inside the
# bundled Next.js standalone build under extraResources).
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

# Everything launched at runtime lands in resources/ (process.resourcesPath).
extraResources:
  # Frozen FastAPI backend (one-folder PyInstaller build).
  - from: ../backend/packaging/dist/aetherrag-backend
    to: backend
  # Bundled backend config (read by frozen config.py next to the exe).
  - from: ../backend/.env.production
    to: backend/.env
  # Next.js standalone server + its server-side node_modules.
  - from: .next/standalone
    to: frontend
  # electron-builder drops the nested node_modules when copying the standalone
  # dir above, so copy the server-side deps (next, react, ...) explicitly.
  - from: .next/standalone/node_modules
    to: frontend/node_modules
  # Static assets are NOT included in standalone — place them where the
  # standalone server expects them.
  - from: .next/static
    to: frontend/.next/static
  - from: public
    to: frontend/public

npmRebuild: false
asar: true

win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
  icon: build/icon.ico
  # Intentionally UNSIGNED — free distribution, no paid code-signing cert.
  # Users see a one-time SmartScreen "Unknown publisher" prompt: click
  # "More info" -> "Run anyway". This is expected and harmless.
  #
  # If you ever want to sign (to remove that prompt), no code changes are
  # needed — just set these env vars before `electron-builder --win`:
  #   CSC_LINK         = path to (or base64 of) a .pfx code-signing cert
  #   CSC_KEY_PASSWORD = the cert password
  # electron-builder then signs automatically.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: AETHER RAG
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
